# ============================================================
# 搭伴 (rokbj.me) - Nginx 配置
# ============================================================
# 此文件应复制到：D:\nginx\conf\nginx.conf
# 注意：路径分隔符一律使用 / (正斜杠)，不要用 Windows 的 \
# 修改完后执行：
#   cd D:\nginx
#   .\nginx.exe -t       # 验证配置
#   .\nginx.exe          # 启动
#   .\nginx.exe -s reload  # 重载配置（不中断服务）
#   .\nginx.exe -s stop    # 停止
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ============================================================
    # Gzip 压缩（减少传输体积，提高加载速度）
    # ============================================================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/json
        application/javascript application/xml+rss
        image/svg+xml;

    # ============================================================
    # WebSocket 升级映射（必须放在 http 块里，server 块外面！）
    # ============================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        # ============================================================
        # ⚠️ 前端 dist 目录路径 - 改成你自己的！
        # ============================================================
        root   E:/TraePorject/make-friends/make-friends-frontend/dist;
        index  index.html;

        # ============================================================
        # 后端 API 反向代理
        # ============================================================
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
        }

        # ============================================================
        # WebSocket 反向代理（聊天功能）
        # ============================================================
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ============================================================
        # Vue Router history 模式（刷新页面不 404）
        # ============================================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ============================================================
        # 静态资源缓存（7 天，减少重复请求）
        # ============================================================
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
