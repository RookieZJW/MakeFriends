# ============================================================
# 搭伴 (rokbj.me) Nginx 配置文件
# 位置: /etc/nginx/conf.d/rokbj.conf
# ============================================================

# HTTP → HTTPS 重定向（可选，配置了SSL后使用）
# server {
#     listen 80;
#     server_name rokbj.me www.rokbj.me;
#     return 301 https://$host$request_uri;
# }

server {
    # 监听 80 端口（HTTP）
    listen 80;
    server_name rokbj.me www.rokbj.me;

    # 如果配置了 SSL 证书，去掉下面这行的注释，改用 443 端口
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/rokbj.me.pem;
    # ssl_certificate_key /etc/nginx/ssl/rokbj.me.key;

    # ========== 前端静态文件 ==========
    # 前端打包后的 dist 目录
    root /home/rokbj/frontend/dist;
    index index.html;

    # 开启 gzip 压缩（加快页面加载速度）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/json
        application/javascript application/xml+rss application/rss+xml
        application/atom+xml image/svg+xml font/ttf font/otf;

    # ========== WebSocket 支持（聊天功能必需） ==========
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ========== 后端 API 反向代理 ==========
    # 所有 /api 开头的请求转发到后端 Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== WebSocket 反向代理 ==========
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # WebSocket 长连接不超时
    }

    # ========== 前端路由（Vue Router history 模式） ==========
    # 刷新页面不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== 静态资源缓存 ==========
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========== 上传文件访问 ==========
    # 后端上传的文件存储目录，需要让 Nginx 可以访问
    location /api/files/ {
        proxy_pass http://127.0.0.1:8080;
        # 或者直接用 alias：
        # alias /home/rokbj/uploads/;
    }

    # ========== 安全头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========== 禁止访问隐藏文件 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
